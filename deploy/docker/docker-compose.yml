# Xplogent on a Linux server with automatic HTTPS.
#
#   cd deploy/docker
#   cp .env.example .env     # set DOMAIN and XPLOGENT_AUTH_TOKEN (and provider keys)
#   docker compose up -d --build
#
# Optional GPU speech servers for the phone agent (needs the NVIDIA Container Toolkit):
#   docker compose --profile gpu-speech up -d
#
# Only Caddy publishes ports (80/443). Xplogent itself is reachable only on the
# internal network and refuses to start without an access token.

name: xplogent

services:
  xplogent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: xplogent:local
    restart: unless-stopped
    env_file: .env
    environment:
      # Fail closed: refuse to start without a dashboard access token.
      XPLOGENT_AUTH_TOKEN: ${XPLOGENT_AUTH_TOKEN:?set XPLOGENT_AUTH_TOKEN in .env (openssl rand -hex 32)}
      # Caddy reaches us over the private compose network, so trust its forwarded headers.
      XPLOGENT_FORWARDED_ALLOW_IPS: "*"
    volumes:
      - xplogent-data:/data
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8765/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      xplogent:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (the public hostname pointing at this server)}
      XPLOGENT_UPSTREAM: xplogent:8765
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # --- optional: local speech for the phone agent (OpenAI-compatible APIs) -------------
  # After starting, set in the dashboard config (voip.stt / voip.tts):
  #   stt.provider: openai-compatible, base_url: http://whisper:8000/v1, model: Systran/faster-whisper-small.en
  #   tts.base_url: http://kokoro:8880/v1, model: kokoro, voice: af_heart
  whisper:
    profiles: ["gpu-speech"]
    # The project was renamed (faster-whisper-server -> speaches); check its README for the
    # current image name and override WHISPER_IMAGE if this one has moved.
    image: ${WHISPER_IMAGE:-fedirz/faster-whisper-server:latest-cuda}
    restart: unless-stopped
    environment:
      WHISPER__MODEL: Systran/faster-whisper-small.en
      WHISPER__INFERENCE_DEVICE: cuda
    volumes:
      - hf-cache:/root/.cache/huggingface
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  kokoro:
    profiles: ["gpu-speech"]
    # Pin a release tag for production (latest tracks main). RTX 50-series cards need a cu128 tag.
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:latest}
    restart: unless-stopped
    expose:
      - "8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  xplogent-data:
  caddy-data:
  caddy-config:
  hf-cache:
