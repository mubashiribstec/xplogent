# Xplogent with Docker. Easiest: the one-command installer does all of this for you:
#   curl -fsSL https://raw.githubusercontent.com/mubashiribstec/xplogent/main/get.sh | sudo bash
#
# Manual use:
#   cp .env.example .env    # set XPLOGENT_AUTH_TOKEN (openssl rand -hex 32), mode, keys
#   docker compose up -d
#
# This base file only defines the app (+ optional extras). How it is reached is picked by
# COMPOSE_FILE in .env (docker compose reads it automatically):
#   HTTPS with a domain : COMPOSE_FILE=docker-compose.yml:compose.https.yml   (Caddy, ports 80/443)
#   No domain / LAN     : COMPOSE_FILE=docker-compose.yml:compose.local.yml   (port 8765, no TLS)
# Optional profiles (COMPOSE_PROFILES in .env, comma separated):
#   speech      Kokoro text-to-speech on CPU for the phone agent
#   gpu-speech  Whisper + Kokoro speech servers for the phone agent (NVIDIA GPU)
#
# No language model runs here: Xplogent uses hosted models (OpenAI, Anthropic, Gemini,
# OpenRouter, ...) or your own Ollama server elsewhere (Settings -> Ollama servers).
#
# The app refuses to start without an access token, in every mode.

name: xplogent

services:
  xplogent:
    # Prebuilt multi-arch image from GitHub Actions. `docker compose build` (or `up --build`)
    # builds from this checkout instead.
    image: ${XPLOGENT_IMAGE:-ghcr.io/mubashiribstec/xplogent:sha-860fceb}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    pull_policy: ${XPLOGENT_PULL_POLICY:-missing}
    restart: unless-stopped
    env_file: .env
    environment:
      # Fail closed: refuse to start without a dashboard access token.
      XPLOGENT_AUTH_TOKEN: ${XPLOGENT_AUTH_TOKEN:?set XPLOGENT_AUTH_TOKEN in .env (openssl rand -hex 32)}
      # Only Caddy (https mode) or the published port reach us; trust forwarded headers.
      XPLOGENT_FORWARDED_ALLOW_IPS: "*"
    extra_hosts:
      # The CRM (and an Ollama server) run on this host, not in a container. On Linux
      # host.docker.internal does not resolve by default, so map it to the host gateway:
      # then voip.crm.base_url can be http://host.docker.internal:<crm-port> and the
      # container reaches the CRM over your LAN.
      - "host.docker.internal:host-gateway"
    volumes:
      - xplogent-data:/data
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8765/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # --- optional: local text-to-speech on CPU for the phone agent (profile "speech") ----
  # Speech-to-text runs inside the xplogent container (faster-whisper, CPU). In the Calls
  # view choose Speech -> "Local on this server" (tts base_url http://kokoro:8880/v1).
  kokoro-cpu:
    profiles: ["speech"]
    image: ${KOKORO_CPU_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:latest}
    restart: unless-stopped
    networks:
      default:
        aliases: [kokoro]
    expose:
      - "8880"

  # --- optional: GPU speech for the phone agent (OpenAI-compatible APIs) -----------------
  # After starting, set in config (voip.stt / voip.tts):
  #   stt.provider: openai-compatible, base_url: http://whisper:8000/v1, model: Systran/faster-whisper-small.en
  #   tts.base_url: http://kokoro:8880/v1, model: kokoro, voice: af_heart
  whisper:
    profiles: ["gpu-speech"]
    # The project was renamed (faster-whisper-server -> speaches); check its README for the
    # current image name and override WHISPER_IMAGE if this one has moved.
    image: ${WHISPER_IMAGE:-fedirz/faster-whisper-server:latest-cuda}
    restart: unless-stopped
    environment:
      WHISPER__MODEL: Systran/faster-whisper-small.en
      WHISPER__INFERENCE_DEVICE: cuda
    volumes:
      - hf-cache:/root/.cache/huggingface
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  kokoro:
    profiles: ["gpu-speech"]
    # Pin a release tag for production (latest tracks main). RTX 50-series cards need a cu128 tag.
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:latest}
    restart: unless-stopped
    expose:
      - "8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  xplogent-data:
  hf-cache:
