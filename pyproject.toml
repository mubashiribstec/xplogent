[project]
name = "xplogent"
version = "0.1.0"
description = "Xplogent — a self-improving AI agent with memory, skills, and a phone-calling agent for Telnyx / FreePBX."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mubashiribstec" }]
keywords = ["ai", "agent", "llm", "ollama", "memory", "automation", "voip", "freepbx"]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "prompt-toolkit>=3.0",
    "tzdata>=2024.1; sys_platform == 'win32'",   # time zones for calling hours (Windows has no system database)
]

[project.optional-dependencies]
# Hosted providers (optional — Ollama works with the base install)
providers = [
    "openai>=1.30",
    "anthropic>=0.34",
]
# (Embeddings run through the configured provider — Ollama/OpenAI — so memory
# needs no extra dependencies.)
# REST/WebSocket API + web dashboard backend
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "python-multipart>=0.0.9",   # file uploads (phone agent training)
]
# Phone calling agent (server side: no microphone/speaker needed)
voip = [
    "faster-whisper>=1.0",
    "av>=11,<19",   # faster-whisper 1.2 calls av.open(metadata_errors=...), which PyAV 19 removed
    "audioop-lts>=0.2; python_version >= '3.13'",
]
# RAG over documents (PDF support; text/markdown/code work without this)
rag = [
    "pypdf>=4.0",
]
# Enterprise security: encrypted secrets at rest + OS keyring for the key
security = [
    "cryptography>=42.0",
    "keyring>=24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Headless Linux server: no desktop control, microphone, or multi-GB torch download.
server = [
    "xplogent[providers,api,voip,rag,security]",
]
all = [
    "xplogent[providers,api,voip,rag,security,dev]",
]

[project.scripts]
xplogent = "xplogent.interfaces.cli.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xplogent = ["skills_library/**/*.md", "config/*.yaml", "web_dist/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
