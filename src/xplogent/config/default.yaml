# ─── Xplogent default configuration ──────────────────────────────────────
# Anything here can be overridden by environment variables (XPLOGENT_*) or a
# user config at ~/.xplogent/config.yaml.

# Active model in "provider:model" form. Overridden by XPLOGENT_MODEL.
model: "ollama:llama3.1"

# Saved model presets shown in the GUI (Settings → Models, Chat switcher).
# effort: off|low|medium|high  ·  thinking: true|false
models:
  - { label: "Llama 3.1 (local)", model: "ollama:llama3.1", temperature: 0.7, effort: "off", thinking: false }
  - { label: "GPT-4o", model: "openai:gpt-4o", temperature: 0.7, effort: "off", thinking: false }
  - { label: "Claude Sonnet", model: "anthropic:claude-sonnet-4-6", temperature: 0.7, effort: "medium", thinking: true }
  - { label: "Gemini 1.5 Pro", model: "gemini:gemini-1.5-pro", temperature: 0.7, effort: "off", thinking: false }
  - { label: "LLaVA (local vision)", model: "ollama:llava", temperature: 0.7, effort: "off", thinking: false, vision: true }

# Optional separate (usually cheaper/local) model for reflection & summaries.
reflection_model: "ollama:llama3.1"

# Embedding model used by the memory subsystem (local by default).
embedding_model: "ollama:nomic-embed-text"

# Vision model for the 'analyze_image' tool (seeing screenshots/images).
# Empty = reuse `model` if it's vision-capable. Examples: openai:gpt-4o,
# anthropic:claude-sonnet-4-6, ollama:llava.
vision_model: ""

agent:
  max_steps: 25            # max think→act iterations per task
  temperature: 0.7
  system_prompt: null      # null = use the built-in default prompt
  provider_retries: 2      # retry transient provider errors (network/timeout/429)
  vision_tools: false      # send tools on image turns (off so local vision e.g. llava works)

memory:
  enabled: true
  short_term_max_tokens: 6000   # summarize the conversation past this budget
  retrieval_top_k: 5            # facts/skills injected per turn
  auto_compact_every: 0         # distill MEMORY.md every N tasks (0 = off; use the GUI/API)
  md_max_chars: 6000            # character budget for the agent-curated MEMORY.md (memory tool)

# Dashboard/API security. Leave auth_token empty for an open localhost server;
# `xplogent token` sets one, and it's auto-generated when binding to 0.0.0.0.
server:
  auth_token: ""

# Cost guardrails. Caps are in USD; 0 disables a cap. When a cap is hit, on_exceed
# is one of: "warn" (notify, keep going), "downgrade" (switch to downgrade_model),
# or "pause" (stop the run). Estimates use the same per-model pricing as Analytics.
# Backup model: answers when the main model/server can't (down, no key, rate limit).
# Default: a small model on the local Ollama in Docker (xplogent-docker backup-model on).
fallback:
  enabled: false
  model: llama3.2:3b               # on the local Ollama; or a full spec like openai:gpt-4o-mini
  host: ""                         # local Ollama URL; blank = http://ollama:11434 (Docker)

budget:
  daily_usd: 0
  session_usd: 0
  on_exceed: warn
  downgrade_model: ""

safety:
  # Policy per risk tier: "auto" (run), "confirm" (ask), or "deny" (block).
  policy:
    low: auto
    medium: confirm
    high: confirm
    critical: deny
  # Commands matching these (regex, case-insensitive) are always critical.
  deny_patterns:
    # POSIX
    - "rm\\s+-rf\\s+/"
    - "mkfs"
    - ":\\(\\)\\s*\\{.*\\};:"   # fork bomb
    - "dd\\s+if=.*of=/dev/"
    # Windows
    - "format\\s+[a-z]:"
    - "del\\s+/[sf]"
    - "rd\\s+/s"
    - "rmdir\\s+/s"
    - "diskpart"
  # Filesystem writes restricted to these roots (empty = no path restriction).
  allowed_write_roots: []

tools:
  enabled:
    - shell
    - filesystem
    - memory

# ─── Execution backend for `shell` / `python_exec` ────────────────────
# Where commands run. "local" = this machine (default). "docker" runs them
# inside a container; "ssh" runs them on a remote host. Isolating execution
# limits the agent's reach without changing any tool. The deny-list still
# applies before dispatch on every backend.
execution:
  backend: local              # local | docker | ssh
  docker:
    image: "python:3.11-slim" # used when no long-lived container is set
    container: ""             # name/id of a running container to `docker exec` into
    workdir: "/work"
  ssh:
    host: ""
    user: ""
    key_path: ""              # path to a private key (optional)
    port: 22

skills:
  enabled: true
  reflect_after_tasks: true   # run self-improvement reflection after qualifying tasks
  reflect_min_steps: 1        # min tools used before reflecting (1 = skip plain chat; 0 = always)
  reflect_every: 1            # only reflect every Nth qualifying task (higher = cheaper)

# ─── Per-agent rights (role profiles) ─────────────────────────────────
# Each role limits which tools an agent may use, its risk policy, the
# filesystem paths it may touch, and network access. A runtime can be
# scoped to a role profile. "*" means "all".
roles:
  orchestrator:
    allowed_tools: "*"
    policy: { low: auto, medium: confirm, high: confirm, critical: deny }
    allowed_paths: []
    network: true
    max_steps: 30
  researcher:
    allowed_tools: [web_search, web_fetch, read_file, list_dir, analyze_image,
                    broadcast, send_message, read_inbox, list_agents]
    policy: { low: auto, medium: confirm, high: deny, critical: deny }
    allowed_paths: []
    network: true
    max_steps: 20
  coder:
    allowed_tools: [read_file, write_file, edit_file, list_dir, shell, python_exec,
                    broadcast, send_message, read_inbox, list_agents]
    policy: { low: auto, medium: auto, high: confirm, critical: deny }
    allowed_paths: []         # set to e.g. ["./workspace"] to sandbox writes
    network: false
    max_steps: 25
  reviewer:
    allowed_tools: [read_file, list_dir, web_search, web_fetch, analyze_image,
                    broadcast, send_message, read_inbox, list_agents]
    policy: { low: auto, medium: confirm, high: deny, critical: deny }
    allowed_paths: []
    network: true
    max_steps: 15
  operator:
    allowed_tools: "*"
    policy: { low: auto, medium: confirm, high: confirm, critical: deny }
    allowed_paths: []
    network: true
    max_steps: 30
  restricted:
    allowed_tools: [read_file, list_dir]
    policy: { low: confirm, medium: deny, high: deny, critical: deny }
    allowed_paths: []
    network: false
    max_steps: 10

# ─── Phone calling agent (inbound/outbound over a SIP/telephony provider) ───
# Off by default. Needs `pip install 'xplogent[voip]'`, a Telnyx number, and a public
# HTTPS/WSS address that points at this server. See extension-free setup in docs/voip.md.
voip:
  enabled: false
  telephony: telnyx                # telnyx (Voice API) | sip (built-in SIP trunk client) | both
  sip:                             # SIP trunk (FreePBX/Asterisk extension, Telnyx SIP connection…)
    server: ""                     # PBX / registrar host or IP
    port: 5060
    username: ""                   # extension / SIP user (password: SIP_PASSWORD secret)
    auth_username: ""              # if different from username
    domain: ""                     # SIP domain/realm (blank = server)
    caller_id: ""                  # outbound caller ID (E.164), if the trunk allows setting it
    public_ip: ""                  # address the PBX should send audio to (blank = auto)
    local_port: 5060               # UDP port this server listens on for SIP
    rtp_start: 10000               # UDP ports for call audio
    rtp_end: 10100
    register: true
    expires: 300
    allow_from: []                 # extra IPs allowed to send calls (the server is always allowed)
    strict_source: false           # true: refuse calls from other addresses even if addressed to us
    max_calls: 4
    ring_timeout: 45               # seconds an outbound call may ring before it is cancelled
  public_url: ""                   # e.g. https://agent.example.com  (no trailing slash)
  webhook_secret: ""               # random string; carrier webhook = {public_url}/telephony/webhook/<secret>
  api_key_env: TELNYX_API_KEY      # env var holding the carrier API key
  company: "our company"
  greeting: "Hello, thanks for calling {company}. You're speaking with an AI assistant, and this call is transcribed so we can help you better. How can I help you?"
  disclose_ai: true                # system injects the AI disclosure into the greeting if the greeting text doesn't already contain it (UK/EU transparency); set false only where disclosure is handled another way
  model: ""                        # LLM for calls; blank = use `model`. Pick a small fast streaming model.
  transfer_number: ""              # human hand-off number (E.164), e.g. +15551234567
  connection_id: ""                # Telnyx Voice API (Call Control) application ID
  telnyx_public_key: ""            # Telnyx portal public key: webhooks must carry a valid Ed25519 signature
  from_number: ""                  # your Telnyx number (E.164), caller ID for outbound calls
  max_call_seconds: 900
  calling_hours: { enabled: true, start: "09:00", end: "20:00", timezone: "" }   # outbound calls; the contact's time zone wins
  cost_per_minute: 0.012           # your estimate: carrier + LLM (shown in the Calls view)
  knowledge_top_k: 3
  vad: { threshold: 500, silence_ms: 700, min_speech_ms: 200, max_utterance_ms: 15000 }
  silence: { prompt_after_s: 12, hangup_after_s: 30, max_prompts: 2 }   # caller gone quiet: up to max_prompts short prompts, then a polite goodbye and hang up
  template: ""                     # built-in template pack: kingsbury_inbound | kingsbury_outbound_screener (supplies greeting + playbook + field schema)
  crm:                             # post-call summary push (Laravel CRM, brief Part 3a)
    enabled: false
    base_url: ""                   # e.g. https://crm.example.com — POSTs go to {base_url}/api/xplogent/call-summary
    api_token_env: XPLOGENT_CRM_API_TOKEN   # env var / secrets-store name holding the bearer token (also the HMAC key)
  fields: []                       # mandatory fields: the call CANNOT close successfully while a required field is missing (Part D enforcement). Example — uncomment to require a read-back-confirmed callback number:
    # - { name: callback_number, label: "best callback number", validator: phone, required: true, require_confirmed: true, default_country: "+44" }
    # - { name: caller_name, label: "caller's name", validator: nonempty, required: true }
  dtmf:                            # phone keypad
    enabled: true                  # keys pressed reach the agent as [keypad: …]; it can press keys too
    keys: {}                       # instant keys, e.g. {"0": "transfer", "*": "repeat"}
  stt:                             # whisper-local = faster-whisper on your GPU; or an OpenAI-compatible URL
    provider: whisper-local        # whisper-local | openai-compatible
    model: small.en
    base_url: ""
    api_key_env: OPENAI_API_KEY
    language: en
    device: auto                   # whisper-local: auto | cpu | cuda
  tts:                             # any OpenAI-compatible /audio/speech (OpenAI, or local Kokoro-FastAPI)
    base_url: "https://api.openai.com/v1"
    model: tts-1
    voice: alloy
    sample_rate: 24000
    api_key_env: OPENAI_API_KEY
