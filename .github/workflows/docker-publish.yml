name: Docker image

# Publishes ghcr.io/<owner>/xplogent for linux/amd64 + linux/arm64.
#   push to main  -> :latest, :main, :sha-<short>
#   tag v1.2.3    -> :1.2.3, :1.2, :1, :latest
# After the first run, make the package public once (GitHub -> your profile -> Packages ->
# xplogent -> Package settings -> Change visibility -> Public), so servers can pull it
# without logging in.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xplogent" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test (amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: xplogent:smoke
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (health, token required, dashboard served)
        run: |
          docker run -d --name xpl -e XPLOGENT_AUTH_TOKEN=smoke-token -p 8765:8765 xplogent:smoke
          for i in $(seq 1 40); do curl -sf localhost:8765/health && break; sleep 1; done
          curl -sf localhost:8765/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8765/sessions)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer smoke-token' localhost:8765/sessions)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8765/)" = "200"
          docker rm -f xpl

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            # main, not "the default branch": this repo's default branch is a dev branch.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
